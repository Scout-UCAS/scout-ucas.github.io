[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responseguard"
version = "0.1.0"
description = "Paired semantic response and conditional diversity constraints for flow-policy training"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "Pillow>=10", "safetensors>=0.4", "filelock>=3"]

[project.optional-dependencies]
sd3 = ["diffusers==0.35.2", "transformers==4.55.4", "peft==0.17.1", "accelerate>=1.2,<2", "torchvision>=0.21", "sentencepiece", "protobuf"]
test = ["pytest>=8"]
eval = ["dreamsim==0.2.1", "open-clip-torch==4.2.2"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
responseguard = "responseguard.cli:main"

[tool.setuptools]
packages = ["responseguard"]
