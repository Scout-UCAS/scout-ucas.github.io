[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuation-test-rl"
version = "0.1.0"
description = "Executable reference implementation of Continuation-Test Reinforcement Learning"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "transformers>=4.57.1,<4.58", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
public = ["pyarrow>=15", "math-verify>=0.7,<1", "scipy>=1.12,<2"]

[project.scripts]
ct-rl = "ct_rl.cli:main"

[tool.setuptools.packages.find]
include = ["ct_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
