<!doctype html>
<html lang="$html_lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <link rel="alternate" hreflang="en" href="https://scout-ucas.github.io/">
  <link rel="alternate" hreflang="zh-CN" href="https://scout-ucas.github.io/zh/">
  <link rel="alternate" hreflang="x-default" href="https://scout-ucas.github.io/">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:image" content="https://scout-ucas.github.io/assets/profile.jpg">
  <meta property="og:url" content="$canonical">
  <link rel="icon" type="image/jpeg" href="${base}assets/profile.jpg">
  <script src="${base}theme.js"></script>
  <link rel="stylesheet" href="${base}styles.css">
</head>
<body id="top">
  <a class="skip" href="#main">$skip</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="wordmark" href="#top">$name</a>
      <nav aria-label="$nav_label">$nav</nav>
      <div class="settings">
        <a class="language" href="$other_url" lang="$other_lang" hreflang="$other_lang">$other_name</a>
        <button class="theme" type="button" hidden aria-label="$dark" data-dark="$dark" data-light="$light">
          <span aria-hidden="true" class="theme-symbol">◐</span>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="shell">
    <section class="hero" aria-labelledby="profile-name">
      <div class="hero-copy">
        <p class="focus">$focus</p>
        <h1 id="profile-name">$name</h1>
        <p class="lead">$introduction</p>
        <p class="bio">$biography</p>
        <div class="profile-links">
          <a class="pill pill-primary" href="$scholar">Google Scholar</a>
          <a class="pill" href="$github">GitHub</a>
          <a class="pill" href="mailto:$email">$email_label</a>
        </div>
      </div>
      <div class="portrait-wrap">
        <img class="portrait" src="${base}assets/profile.jpg" alt="$portrait_alt" width="256" height="251" fetchpriority="high">
      </div>
    </section>
    <section class="section" id="research" aria-labelledby="research-title">
      <h2 id="research-title">$research_title</h2>
      <div class="research-grid">$research_items</div>
    </section>
    <section class="section" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">$projects_title</h2>
      <div class="project-grid">$project_items</div>
    </section>
    <section class="section" id="news" aria-labelledby="news-title">
      <h2 id="news-title">$news_title</h2>
      <ul class="news-list">$news_items</ul>
    </section>
    <section class="section" id="publications" aria-labelledby="papers-title">
      <div class="section-header">
        <h2 id="papers-title">$publications_title</h2>
        <a class="text-link" href="$scholar">$all_publications</a>
      </div>
      <div class="papers">$paper_items</div>
    </section>
  </main>
  <footer class="shell footer">
    <span>$name</span><a href="#top">$top</a>
  </footer>
</body>
</html>
